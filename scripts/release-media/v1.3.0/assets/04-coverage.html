<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="theme.css" />
<style>
  .scene { background: var(--ink); align-items: center; padding: 80px 90px; }
  .head { text-align: center; margin-bottom: 34px; }
  .head h1 { font-family: "Plex Sans"; font-weight: 600; font-size: 36px; margin: 14px 0 0; letter-spacing: -0.01em; }
  .head p { font-family: "Plex Sans"; font-size: 17px; line-height: 1.5; color: var(--text-muted); margin: 16px 0 0; max-width: 600px; }
  .panel { width: 600px; padding: 30px 32px; }
  .kv .v.result {
    font-size: 18px; letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="head">
    <span class="eyebrow">Evaluation coverage</span>
    <h1>Coverage that tells the truth</h1>
  </div>
  <div class="panel" id="panel">
    <div class="kv"><span class="k">Rule execution coverage</span><span class="v pass">Complete</span></div>
    <div class="kv"><span class="k">Kubernetes evidence</span><span class="v pass">Complete</span></div>
    <div class="kv"><span class="k">AWS evidence</span><span class="v warning">Partial</span></div>
    <div class="kv"><span class="k">Overall decision coverage</span><span class="v warning">Partial</span></div>
    <div class="kv"><span class="k">Result</span><span class="v warning result">INCOMPLETE</span></div>
  </div>
  <div class="head" style="margin-top: 26px; margin-bottom: 0;">
    <p>Available findings are scored. Incomplete evidence is disclosed &mdash; not silently dropped.</p>
  </div>
</div>
<script>
  window.sceneReady = false;
  window.fadeOut = () => document.getElementById('scene').classList.add('fade-out');
  setTimeout(() => document.getElementById('panel').classList.add('show'), 250);
  setTimeout(() => { window.sceneReady = true; }, 900);
</script>
</body>
</html>
