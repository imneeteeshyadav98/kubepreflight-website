<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../assets/theme.css" />
<style>
  html, body, .scene { width: 1920px; height: 1080px; }
  .scene { background: radial-gradient(ellipse at 50% 30%, #101c1a 0%, #0a1211 70%); }
  .mark { display: flex; align-items: center; gap: 26px; margin-bottom: 46px; }
  .mark .box {
    width: 88px; height: 88px; border: 5px solid var(--accent); border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  .mark .box svg { width: 42px; height: 42px; }
  .mark .name { font-family: "Plex Sans"; font-weight: 600; font-size: 56px; letter-spacing: -0.01em; }
  .mark .name b { color: var(--accent); }
  h1 {
    font-family: "Plex Sans"; font-weight: 600; font-size: 40px; margin: 0 0 40px;
    color: var(--text-muted); letter-spacing: 0.01em;
  }
  .tagline {
    font-family: "Plex Sans"; font-weight: 600; font-size: 62px; text-align: center;
    color: var(--text); margin: 0 0 60px; max-width: 1300px; line-height: 1.3;
    white-space: nowrap;
  }
  .footer { display: flex; flex-direction: row; align-items: center; gap: 30px; }
  .url { font-family: "Plex Mono"; font-size: 38px; color: var(--accent); letter-spacing: 0.01em; }
  .secondary { font-family: "Plex Mono"; font-size: 26px; color: var(--text-muted); }
  .dot { color: var(--border); font-size: 26px; }
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="mark">
    <div class="box"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12L10 18L20 6" stroke="#3fd9ce" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="name">Kube<b>Preflight</b></div>
  </div>
  <h1>v1.3.0</h1>
  <div class="tagline">Upgrade readiness you can audit.</div>
  <div class="footer">
    <div class="url">kubepreflight.com</div>
    <span class="dot">&middot;</span>
    <div class="secondary">Open source on GitHub</div>
  </div>
</div>
<script>
  window.sceneReady = true;
  window.fadeOut = () => document.getElementById('scene').classList.add('fade-out');
</script>
</body>
</html>
