<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../assets/theme.css" />
<style>
  html, body, .scene { width: 1920px; height: 1080px; }
  .scene { background: radial-gradient(ellipse at 50% 30%, #101c1a 0%, #0a1211 70%); }
  .mark { display: flex; align-items: center; gap: 26px; margin-bottom: 54px; }
  .mark .box {
    width: 88px; height: 88px; border: 5px solid var(--accent); border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  .mark .box svg { width: 42px; height: 42px; }
  .mark .name { font-family: "Plex Sans"; font-weight: 600; font-size: 56px; letter-spacing: -0.01em; }
  .mark .name b { color: var(--accent); }
  h1 {
    font-family: "Plex Sans"; font-weight: 600; font-size: 40px; margin: 0 0 34px;
    color: var(--text-muted); letter-spacing: 0.01em;
  }
  .subtitle {
    font-family: "Plex Sans"; font-weight: 600; font-size: 72px; line-height: 1.2;
    text-align: center; color: var(--text); margin: 0 0 44px; max-width: 1500px;
    white-space: nowrap;
  }
  .subtitle .accent { color: var(--accent); }
  .support {
    font-family: "Plex Mono", ui-monospace, monospace; font-size: 30px;
    color: var(--text-muted); letter-spacing: 0.005em;
  }
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="mark">
    <div class="box"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12L10 18L20 6" stroke="#3fd9ce" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="name">Kube<b>Preflight</b></div>
  </div>
  <h1>v1.3.0</h1>
  <div class="subtitle">Evidence Integrity <span class="accent">&amp; Evaluation Semantics</span></div>
  <div class="support">Know what was actually evaluated.</div>
</div>
<script>
  window.sceneReady = true;
  window.fadeOut = () => document.getElementById('scene').classList.add('fade-out');
</script>
</body>
</html>
